              - name: facts
                label: Fact sheet
                label_singular: Fact
                widget: list
                i18n: true
                fields:
                  - { name: label, label: Label, widget: string, i18n: true }
                  - { name: value, label: Value, widget: string, i18n: true, hint: "The figure or name, set large." }
                  - { name: note, label: Note, widget: text, required: false, i18n: true }
                  - { name: wide, label: "Full width", widget: boolean, default: false, required: false, i18n: duplicate, hint: "For a long value, such as a list." }
      - name: copy
        label: Interface text
        file: content/copy.json
        i18n: true
        description: "Headings, introductions, buttons and labels across the site. Each section is one page or part of the page."
        fields:
          - name: "nav"
            label: "Navigation"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "home", label: "Home", widget: string, i18n: true }
              - { name: "about", label: "About", widget: string, i18n: true }
              - { name: "programs", label: "Programs", widget: string, i18n: true }
              - { name: "impact", label: "Impact", widget: string, i18n: true }
              - { name: "events", label: "Events", widget: string, i18n: true }
              - { name: "stories", label: "Stories", widget: string, i18n: true }
              - { name: "connect", label: "Connect", widget: string, i18n: true }
              - { name: "vidyalaya", label: "Vidyalaya", widget: string, i18n: true }
          - name: "lang"
            label: "Language switch"
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: "switchLabel", label: "Switch label", widget: string, i18n: true }
              - { name: "switchAria", label: "Switch aria", widget: string, i18n: true }
          - name: "site"
            label: "Site"
            widget: object
            i18n: true
            collapsed: true
            fields:
