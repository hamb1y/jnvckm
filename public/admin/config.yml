# Sveltia CMS. A content edit is a commit; a build consumes it.
#
# Validate this file with `bun run cms`, and against the schema published with
# the CMS with `bun run cms --schema`. The verifier (`bun run verify`) fails if a
# field exists in content/ but is not declared here, because Sveltia drops
# undeclared fields when an editor saves.
#
# Signing in
# ----------
# 1. Locally, no authentication at all: `bun dev`, open /admin/index.html,
#    choose "Work with Local Repository" and pick the repo root (Chromium only).
# 2. In the browser, right now: sign in with a GitHub personal access token
#    (contents: write). No server needed. See README.
# 3. In the browser, with OAuth: deploy the auth worker (README section 3),
#    set its secrets and ALLOWED_DOMAINS, create a GitHub OAuth app whose
#    callback is <worker-url>/callback, verify it with `bun run cms:worker`,
#    then set `base_url` below to the worker origin.
#
# `base_url` is required for OAuth: with it unset, Sveltia falls back to Netlify's
# auth endpoint, which only works for sites hosted on Netlify. PKCE is not an
# option here either — Sveltia rejects `auth_type: pkce` for GitHub.
#
# See LAUNCH-CHECKLIST.md item 6.

backend:
  name: github
  repo: hamb1y/jnvckm
  branch: main
  auth_scope: public_repo # the repository is public, so the narrower grant is enough
  auth_methods: [oauth, token] # token sign-in works before the worker exists
  base_url: https://auth.jnvckm.org

media_folder: public/images
public_folder: /images

output:
  omit_empty_optional_fields: true

collections:
  - name: posts
    label: Stories and news
    label_singular: Story
    folder: content/posts
    format: json
    extension: json
    create: true
    identifier_field: slug
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: slug, label: Slug, widget: string, hint: "Used in the web address. Changing it breaks existing links." }
      - { name: kind, label: Kind, widget: select, options: [news, report, story], default: news, hint: "News and reports are association updates; stories are memories in an alumni voice." }
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: summary, label: Summary, widget: text, hint: "One line, shown in lists and used as the page description." }
      - { name: body, label: Body, widget: markdown, required: false, hint: "Leave empty for a summary-only record." }
      - { name: author, label: Author, widget: string, required: false }
      - { name: batch, label: Batch, widget: string, required: false, hint: 'For example "9th batch".' }
      - { name: image, label: Photo, widget: object, required: false, fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string, hint: "Describe only what is visible. Required if a photo is set." }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
      - { name: documents, label: Documents, label_singular: Document, widget: list, required: false, hint: "Posters, press clippings, report covers, screenshots. These are shown uncropped.", fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string }, { name: caption, label: Caption, widget: string, required: false } ] }
      - { name: source, label: Source, widget: string, required: false, hint: "Where this record came from." }

  - name: events
    label: Events
    label_singular: Event
    folder: content/events
    format: json
    extension: json
    create: true
    identifier_field: slug
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: slug, label: Slug, widget: string }
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: program, label: Program, widget: relation, collection: programs, value_field: id, search_fields: [name], display_fields: [name], required: false, hint: "Lists this event under the program's editions." }
      - { name: series, label: Series, widget: string, required: false, hint: 'For events that are not part of a program. Events with the same series, for example "meet", link to each other.' }
      - { name: location, label: Location, widget: string, required: false }
      - { name: summary, label: Summary, widget: text }
      - { name: body, label: Body, widget: markdown, required: false }
      - { name: image, label: Photo, widget: object, required: false, fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
      - { name: documents, label: Documents, label_singular: Document, widget: list, required: false, fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string }, { name: caption, label: Caption, widget: string, required: false } ] }
      - { name: source, label: Source, widget: string, required: false }

  - name: contributions
    label: Contributions
    label_singular: Contribution
    folder: content/contributions
    format: json
    extension: json
    create: true
    identifier_field: slug
    summary: "{{title}} — {{batch}}"
    sortable_fields: [date, title, category]
    fields:
      - { name: slug, label: Slug, widget: string }
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: category, label: Category, widget: relation, collection: settings, file: categories, value_field: "categories.*.id", search_fields: ["categories.*.label"], display_fields: ["categories.*.label"], hint: "Add or rename categories in Site settings → Contribution categories." }
      - { name: batch, label: Batch, widget: string, required: false, hint: 'For example "8th batch".' }
      - { name: amount, label: "Amount in rupees", widget: number, required: false, hint: "Whole rupees. Leave empty if the record does not state an amount." }
      - { name: summary, label: Summary, widget: text }
      - { name: body, label: Body, widget: markdown, required: false }
      - { name: archiveNote, label: "Archive note", widget: text, required: false, hint: "Shown when a historical record has been redacted for privacy." }
      - { name: image, label: Photo, widget: object, required: false, fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
      - { name: documents, label: Documents, label_singular: Document, widget: list, required: false, fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string }, { name: caption, label: Caption, widget: string, required: false } ] }
      - { name: source, label: Source, widget: string, required: false }

  - name: programs
    label: Programs
    label_singular: Program
    folder: content/programs
    format: json
    extension: json
    create: true
    identifier_field: id
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: id, label: Id, widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"], hint: "The page address, /programs/<id>. Changing it breaks existing links and unlinks its events." }
      - { name: order, label: Order, widget: number, value_type: int, default: 1, hint: "Programs are listed from the lowest number up." }
      - { name: name, label: Name, widget: string }
      - { name: shortName, label: "Short name", widget: string, required: false }
      - { name: tagline, label: Tagline, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: body, label: Body, widget: markdown }
      - { name: startNote, label: "History note", widget: text }
      - { name: image, label: Photo, widget: object, required: false, fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site
        file: content/site.json
        fields:
          - { name: name, label: "Association name", widget: string }
          - { name: logo, label: Logo, widget: image, required: false, hint: "Shown at the top of every page. Without one, the name is shown as text." }
          - { name: socialImage, label: "Sharing image", widget: image, required: false, hint: "Shown when a page without its own photograph is shared. Landscape, about 1200 × 630." }
          - { name: schoolName, label: "School name", widget: string }
          - { name: formed, label: "Formed in", widget: number }
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: Description, widget: text }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: email, label: Email, widget: string, required: false, hint: "Leave empty until the association confirms it; the site shows a 'to be confirmed' state." }
              - { name: emailVerified, label: "Email confirmed", widget: boolean, default: false }
              - { name: phone, label: Phone, widget: string, required: false }
              - { name: phoneVerified, label: "Phone confirmed", widget: boolean, default: false }
              - { name: address, label: Address, widget: string }
          - { name: repository, label: "Repository URL", widget: string }
          - name: credit
            label: Credit
            widget: object
            required: false
            fields: [ { name: label, label: Label, widget: string }, { name: url, label: URL, widget: string } ]
          - name: license
            label: Licence
            widget: object
            required: false
            hint: "Shown in the footer next to the author credit."
            fields: [ { name: label, label: Label, widget: string }, { name: url, label: URL, widget: string } ]
          - name: socials
            label: "Social channels"
            label_singular: Channel
            widget: list
            required: false
            hint: "Only add channels the association has confirmed, and switch on 'Confirmed' when it has. Everything else is treated as unverified."
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
              - { name: verified, label: Confirmed, widget: boolean, default: false }
          - name: nav
            label: Navigation
            widget: object
            collapsed: true
            hint: "Which pages are linked, in order. Their names are in Interface text → Navigation."
            fields:
              - { name: header, label: "Top of the page", label_singular: Link, widget: list, fields: [ { name: page, label: Page, widget: select, options: [ { label: Home, value: home }, { label: About, value: about }, { label: Programs, value: programs }, { label: Contributions, value: contributions }, { label: Events, value: events }, { label: Stories, value: stories }, { label: Connect, value: connect }, { label: Vidyalaya, value: vidyalaya } ] } ] }
              - { name: footer, label: "Foot of the page", label_singular: Link, widget: list, fields: [ { name: page, label: Page, widget: select, options: [ { label: Home, value: home }, { label: About, value: about }, { label: Programs, value: programs }, { label: Contributions, value: contributions }, { label: Events, value: events }, { label: Stories, value: stories }, { label: Connect, value: connect }, { label: Vidyalaya, value: vidyalaya } ] } ] }
          - name: donations
            label: Donations
            widget: object
            fields:
              - { name: note, label: Note, widget: text }
      - name: pages
        label: Pages
        file: content/pages.json
        fields:
          - name: home
            label: Home page
            widget: object
            collapsed: true
            fields:
              - { name: hero, label: "Cover photo", widget: object, required: false, hint: "The tall photograph beside the association's name.", fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string, hint: "Describe only what is visible." }, { name: caption, label: Caption, widget: string, required: false }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
              - { name: lab, label: "Giving photo", widget: object, required: false, hint: "Leads the giving record.", fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string, hint: "Describe only what is visible." }, { name: caption, label: Caption, widget: string, required: false }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
              - { name: campus, label: "Vidyalaya photo", widget: object, required: false, hint: "Beside 'Where it began'.", fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string, hint: "Describe only what is visible." }, { name: caption, label: Caption, widget: string, required: false }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
              - { name: featured, label: "Featured event", widget: relation, collection: events, value_field: slug, search_fields: [title], display_fields: [title], required: false, hint: "Its photograph runs the full width of the page, linking to the event. Pick one with a photo." }
              - { name: latestCount, label: "Latest records shown", widget: number, value_type: int, min: 1, max: 12, default: 3 }
          - name: about
            label: About page
            widget: object
            collapsed: true
            fields:
              - { name: photo, label: "Photo", widget: object, required: false, hint: "Beside the association's story.", fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string, hint: "Describe only what is visible." }, { name: caption, label: Caption, widget: string, required: false }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
              - name: work
                label: What the association does
                label_singular: Line
                widget: list
                fields:
                  - { name: item, label: Line, widget: string }
          - name: vidyalaya
            label: Vidyalaya page
            widget: object
            collapsed: true
            fields:
              - { name: founded, label: "Founded in", widget: number, hint: "Set large beside the page title." }
              - { name: photo, label: "Photo", widget: object, required: false, hint: "Above the fact sheet.", fields: [ { name: src, label: File, widget: image }, { name: alt, label: Alt text, widget: string, hint: "Describe only what is visible." }, { name: caption, label: Caption, widget: string, required: false }, { name: position, label: "Crop focus", widget: select, options: [center, top, bottom, left, right], default: center } ] }
              - name: facts
                label: Fact sheet
                label_singular: Fact
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: value, label: Value, widget: string, hint: "The figure or name, set large." }
                  - { name: note, label: Note, widget: text, required: false }
                  - { name: wide, label: "Full width", widget: boolean, default: false, required: false, hint: "For a long value, such as a list." }
              - name: links
                label: Links
                label_singular: Link
                widget: list
                required: false
                hint: "Shown below the fact sheet as the address, then the description."
                fields:
                  - { name: url, label: URL, widget: string }
                  - { name: label, label: Description, widget: string }
          - name: connect
            label: Connect page
            widget: object
            collapsed: true
            fields:
              - { name: batchReps, label: "Batch representatives story", widget: relation, collection: posts, value_field: slug, search_fields: [title], display_fields: [title], required: false, hint: "Linked from the batch representatives section." }
      - name: categories
        label: Contribution categories
        file: content/categories.json
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            hint: "In the order the filter shows them. Changing an id unlinks the contributions filed under it."
            fields:
              - { name: id, label: Id, widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"] }
              - { name: label, label: Name, widget: string }
      - name: copy
        label: Interface text
        file: content/copy.json
        fields:
          - name: "nav"
            label: "Navigation"
            widget: object
            collapsed: true
            fields:
              - { name: "home", label: "Home", widget: string }
              - { name: "about", label: "About", widget: string }
              - { name: "programs", label: "Programs", widget: string }
              - { name: "impact", label: "Impact", widget: string }
              - { name: "events", label: "Events", widget: string }
              - { name: "stories", label: "Stories", widget: string }
              - { name: "connect", label: "Connect", widget: string }
              - { name: "vidyalaya", label: "Vidyalaya", widget: string }
          - name: "lang"
            label: "Language switch"
            widget: object
            collapsed: true
            fields:
              - { name: "switchLabel", label: "Switch label", widget: string }
              - { name: "switchAria", label: "Switch aria", widget: string }
          - name: "site"
            label: "Site"
            widget: object
            collapsed: true
            fields:
              - { name: "formedShort", label: "Formed short", widget: string, hint: "{formed} is the year the association was formed and {founded} the year the school was founded, both set elsewhere in settings." }
          - name: "home"
            label: "Home page"
            widget: object
            collapsed: true
            fields:
              - { name: "explore", label: "Explore", widget: string }
              - { name: "impactTitle", label: "Impact title", widget: string }
              - { name: "latestTitle", label: "Latest title", widget: string }
              - { name: "heroBody", label: "Hero body", widget: text, hint: "{formed} is the year the association was formed and {founded} the year the school was founded, both set elsewhere in settings." }
              - { name: "latestCta", label: "Latest cta", widget: string }
              - { name: "reconnect", label: "Reconnect", widget: string }
              - { name: "vidyalayaTitle", label: "Vidyalaya title", widget: string }
              - { name: "vidyalayaLede", label: "Vidyalaya lede", widget: text, hint: "{formed} is the year the association was formed and {founded} the year the school was founded, both set elsewhere in settings." }
              - { name: "connectTitle", label: "Connect title", widget: string }
              - { name: "connectLede", label: "Connect lede", widget: text }
              - { name: "given", label: "Given", widget: string }
              - name: "figures"
                label: "Figures"
                widget: object
                collapsed: true
                fields:
                  - { name: "contributions", label: "Contributions", widget: string }
                  - { name: "events", label: "Events", widget: string }
          - name: "common"
            label: "Shared labels"
            widget: object
            collapsed: true
            fields:
              - { name: "allContributions", label: "All contributions", widget: string }
              - { name: "allEvents", label: "All events", widget: string }
              - { name: "location", label: "Location", widget: string }
              - { name: "batch", label: "Batch", widget: string }
              - { name: "amount", label: "Amount", widget: string }
              - { name: "category", label: "Category", widget: string }
              - { name: "documents", label: "Documents", widget: string }
              - { name: "source", label: "Source", widget: string }
              - { name: "englishOnly", label: "English only", widget: string }
              - { name: "program", label: "Program", widget: string }
              - { name: "author", label: "Author", widget: string }
          - name: "events"
            label: "Events page"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: text }
              - { name: "upcoming", label: "Upcoming", widget: string }
              - { name: "past", label: "Past", widget: string }
          - name: "impact"
            label: "Contributions page"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: text }
              - { name: "filterLabel", label: "Filter label", widget: string }
              - { name: "all", label: "All", widget: string }
              - { name: "empty", label: "Empty", widget: string }
              - { name: "count", label: "Count", widget: string, hint: "Keep {n}, {total} as written; the site fills them in." }
              - { name: "summary", label: "Summary", widget: string, hint: "Keep {count}, {from}, {to} as written; the site fills them in." }
          - name: "stories"
            label: "Stories page"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: string }
              - { name: "empty", label: "Empty", widget: string }
          - name: "vidyalaya"
            label: "Vidyalaya page"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: string }
          - name: "about"
            label: "About page"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: text }
              - { name: "whatWeDo", label: "What we do", widget: string }
          - name: "connect"
            label: "Connect page"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: string }
              - { name: "address", label: "Address", widget: string }
              - { name: "routeTitle", label: "Route title", widget: string }
              - { name: "routeBody", label: "Route body", widget: text }
              - { name: "volunteerTitle", label: "Volunteer title", widget: string }
              - { name: "volunteerBody", label: "Volunteer body", widget: text }
              - { name: "contributeTitle", label: "Contribute title", widget: string }
              - { name: "batchRepsTitle", label: "Batch reps title", widget: string }
              - { name: "batchRepsBody", label: "Batch reps body", widget: text }
              - { name: "batchRepsLink", label: "Batch reps link", widget: string }
          - name: "footer"
            label: "Footer"
            widget: object
            collapsed: true
            fields:
              - { name: "association", label: "Association", widget: string }
              - { name: "independent", label: "Independent", widget: text }
              - { name: "repository", label: "Repository", widget: string }
              - { name: "creditLabel", label: "Credit label", widget: string }
          - name: "notfound"
            label: "Page not found"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: string }
          - name: "a11y"
            label: "Accessibility labels"
            widget: object
            collapsed: true
            fields:
              - { name: "skip", label: "Skip", widget: string }
              - { name: "menu", label: "Menu", widget: string }
              - { name: "primaryNav", label: "Primary nav", widget: string }
          - name: "programs"
            label: "Programs page"
            widget: object
            collapsed: true
            fields:
              - { name: "title", label: "Title", widget: string }
              - { name: "lede", label: "Lede", widget: text }
              - { name: "relatedEvents", label: "Related events", widget: string }
              - { name: "more", label: "More", widget: string, hint: "Keep {name} as written; the site fills it in." }
          - name: "posts"
            label: "Story kinds"
            widget: object
            collapsed: true
            fields:
              - name: "kind"
                label: "Kinds"
                widget: object
                collapsed: true
                fields:
                  - { name: "news", label: "News", widget: string }
                  - { name: "report", label: "Report", widget: string }
                  - { name: "story", label: "Story", widget: string }
                  - { name: "event", label: "Event", widget: string }
          - name: "empty"
            label: "Empty states"
            widget: object
            collapsed: true
            fields:
              - { name: "generic", label: "Generic", widget: string }
